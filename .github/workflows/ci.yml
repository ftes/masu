name: ci

# Perf experiment (Firefox): the port with and without tracing, against the
# original JS suite on Playwright 1.56.1 (its pin) and 1.65.0 (the port's).
on:
  pull_request:

jobs:
  port:
    name: port ff ${{ matrix.trace }} ${{ matrix.rep }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble
      options: --ipc=host
    env:
      HOME: /root
    strategy:
      fail-fast: false
      matrix:
        trace: [trace, notrace]
        rep: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - name: Erlang and Elixir, as in .tool-versions
        id: beam
        run: |
          otp=$(awk '$1 == "erlang" { print $2 }' .tool-versions)
          elixir=$(awk '$1 == "elixir" { print $2 }' .tool-versions)
          mkdir -p /opt/beam/elixir
          curl -fsSL "https://builds.hex.pm/builds/otp/amd64/ubuntu-24.04/OTP-$otp.tar.gz" | tar xz -C /opt/beam
          (cd "/opt/beam/OTP-$otp" && ./Install -minimal "/opt/beam/OTP-$otp" > /dev/null)
          curl -fsSL -o /tmp/elixir.zip "https://builds.hex.pm/builds/elixir/v$elixir.zip"
          if command -v python3; then python3 -m zipfile -e /tmp/elixir.zip /opt/beam/elixir; else npx --yes extract-zip@2.0.1 /tmp/elixir.zip /opt/beam/elixir; fi
          chmod +x /opt/beam/elixir/bin/*
          echo "/opt/beam/OTP-$otp/bin" >> "$GITHUB_PATH"
          echo "/opt/beam/elixir/bin" >> "$GITHUB_PATH"
          echo "otp=$otp" >> "$GITHUB_OUTPUT"
          echo "elixir=$elixir" >> "$GITHUB_OUTPUT"
          echo "playwright=$(grep -o '"playwright": {:hex, :playwright_ex, "[^"]*"' mix.lock | grep -o '[^"]*"$' | tr -d '"')" >> "$GITHUB_OUTPUT"
      - run: mix local.hex --force && mix local.rebar --force
      - uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: mix-e2e-pwex-${{ steps.beam.outputs.elixir }}-${{ steps.beam.outputs.otp }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            mix-e2e-pwex-${{ steps.beam.outputs.elixir }}-${{ steps.beam.outputs.otp }}-
      - uses: actions/cache@v6
        with:
          path: /root/.cache/playwright
          key: playwright-ex-${{ steps.beam.outputs.playwright }}
      - run: mix deps.get
      - run: npm ci
        working-directory: assets
      - run: mix playwright.install -- firefox
        env:
          MIX_ENV: test
      - run: nproc; cat /proc/cpuinfo | grep "model name" | head -1; free -m
      - name: mix test --only e2e
        run: mix test --only e2e || true
        env:
          MIX_ENV: test
          E2E_BROWSERS: firefox
          E2E_TIMELINE: test/perf/timeline_formatter.exs
          E2E_TIMELINE_OUT: timeline.tsv
          E2E_TRACE: ${{ matrix.trace == 'notrace' && 'off' || 'on' }}
      - run: python3 -I test/perf/analyze.py timeline.tsv --tests
      - uses: actions/upload-artifact@v7
        with:
          name: port-${{ matrix.trace }}-${{ matrix.rep }}
          path: timeline.tsv

  js:
    name: js ff ${{ matrix.pw }} ${{ matrix.rep }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v${{ matrix.pw }}-noble
      options: --ipc=host
    env:
      HOME: /root
    strategy:
      fail-fast: false
      matrix:
        pw: ["1.56.1", "1.65.0"]
        rep: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - name: Erlang and Elixir, as in .tool-versions
        id: beam
        run: |
          otp=$(awk '$1 == "erlang" { print $2 }' .tool-versions)
          elixir=$(awk '$1 == "elixir" { print $2 }' .tool-versions)
          mkdir -p /opt/beam/elixir
          curl -fsSL "https://builds.hex.pm/builds/otp/amd64/ubuntu-24.04/OTP-$otp.tar.gz" | tar xz -C /opt/beam
          (cd "/opt/beam/OTP-$otp" && ./Install -minimal "/opt/beam/OTP-$otp" > /dev/null)
          curl -fsSL -o /tmp/elixir.zip "https://builds.hex.pm/builds/elixir/v$elixir.zip"
          if command -v python3; then python3 -m zipfile -e /tmp/elixir.zip /opt/beam/elixir; else npx --yes extract-zip@2.0.1 /tmp/elixir.zip /opt/beam/elixir; fi
          chmod +x /opt/beam/elixir/bin/*
          echo "/opt/beam/OTP-$otp/bin" >> "$GITHUB_PATH"
          echo "/opt/beam/elixir/bin" >> "$GITHUB_PATH"
          echo "otp=$otp" >> "$GITHUB_OUTPUT"
          echo "elixir=$elixir" >> "$GITHUB_OUTPUT"
      - run: mix local.hex --force && mix local.rebar --force
      - uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: mix-e2e-image-${{ steps.beam.outputs.elixir }}-${{ steps.beam.outputs.otp }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            mix-e2e-image-${{ steps.beam.outputs.elixir }}-${{ steps.beam.outputs.otp }}-
      - run: mix deps.get
      - run: npm ci
        working-directory: assets
      - run: npm ci
        working-directory: e2e
      - if: matrix.pw != '1.56.1'
        run: npm install --no-save @playwright/test@${{ matrix.pw }}
        working-directory: e2e
      # The server compiles here, so that the tests' time has none of it.
      - run: mix do compile + masu.build
        env:
          MIX_ENV: dev
      - run: nproc; cat /proc/cpuinfo | grep "model name" | head -1; free -m
      - run: npx playwright test --retries=0 --reporter=list,json || true
        working-directory: e2e
        env:
          CI: "true"
          E2E_BROWSERS: firefox
          PLAYWRIGHT_JSON_OUTPUT_NAME: results.json
      - run: if command -v python3; then python3 -I test/perf/analyze.py e2e/results.json --tests; fi
      - uses: actions/upload-artifact@v7
        with:
          name: js-${{ matrix.pw }}-${{ matrix.rep }}
          path: e2e/results.json
